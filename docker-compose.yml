services:
  study-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study-sync
    restart: unless-stopped
    network_mode: host
    environment:
      STUDY_SYNC_PORT: "3001"
      STUDY_SYNC_DATA_DIR: "/data"
      JAVA_OPTS: "-Xms128m -Xmx512m"
      SPRING_PROFILES_ACTIVE: "postgresql"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:5432/studysync"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_URL: "jdbc:postgresql://127.0.0.1:5432/studysync"
      DATABASE_USERNAME: "${POSTGRES_USER}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - ./data:/data
    mem_limit: 768m
