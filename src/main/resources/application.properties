spring.application.name=study-sync
study-sync.data-dir=${STUDY_SYNC_DATA_DIR:${user.home}/.study-sync}
spring.datasource.url=jdbc:sqlite:${study-sync.data-dir}/study-sync.db
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlite

study-sync.schedule.cron=0 0 20 * * MON
study-sync.schedule.zone=America/Sao_Paulo
study-sync.schedule.enabled=true
study-sync.sync-on-startup=true
study-sync.run-once=false
study-sync.retry.max-attempts=3
study-sync.retry.delay-ms=30000

clockify.base-url=https://api.clockify.me/api/v1
clockify.api-key=${CLOCKIFY_API_KEY}
clockify.user-id=${CLOCKIFY_USER_ID:}
clockify.workspace-id=${CLOCKIFY_WORKSPACE_ID:}


notion.data-source-id=
notion.base-url=https://api.notion.com/v1
notion.api-key=${NOTION_API_KEY}
