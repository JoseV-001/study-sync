spring.application.name=study-sync

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/study_sync}
spring.datasource.username=${DATABASE_USERNAME:study_sync}
spring.datasource.password=${DATABASE_PASSWORD:study_sync}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

study-sync.schedule.cron=0 0 20 * * MON
study-sync.schedule.zone=America/Sao_Paulo
study-sync.sync-on-startup=true
study-sync.retry.max-attempts=3
study-sync.retry.delay-ms=30000

clockify.base-url=https://api.clockify.me/api/v1
clockify.api-key=${CLOCKIFY_API_KEY}
clockify.user-id=696eda7e173e8150a15a6ee7
clockify.workspace-id=696eda7d173e8150a15a6ee2


notion.data-source-id=9d255e9c-898c-4c5a-835f-cc1ab0187ea3
notion.base-url=https://api.notion.com/v1
notion.api-key=${NOTION_API_KEY}
